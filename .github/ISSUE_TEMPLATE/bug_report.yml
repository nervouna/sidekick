name: Bug report
description: Something in Sidekick does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste an API key into an issue.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did and what went wrong. Error messages shown in the app help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The steps or the question that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (shown in Settings) or the commit you built.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Chat and answers
        - Web search
        - Clipboard context
        - Settings and API keys
        - Global shortcut
        - Build and release scripts
        - Docs
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. If you know where the cause is, say so.
